# Alembic: database schema migrations. The app applies them on start (db.init_db()).
# After changing tables.py, from backend/, against a database the app created fresh (one carried over from
# before Alembic has small leftover differences that autogenerate would pick up):
#   DB_PATH=fresh.db alembic upgrade head
#   DB_PATH=fresh.db alembic revision --autogenerate -m "what changed"
# then review the generated file in migrations/versions/.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
